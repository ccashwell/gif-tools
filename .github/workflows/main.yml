name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Reusable workflows can't request more permissions than the caller, so we
# declare the union of what release.yml and codeql-analysis.yml need.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  security-events: write
  id-token: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/pr.yml

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql-analysis.yml

  release:
    name: Release
    # Only release from main, after tests pass. npm auth is via OIDC
    # trusted publishing — see release.yml for the id-token permission
    # and npmjs.com → gif-tools → Trusted Publishers for the config.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    uses: ./.github/workflows/release.yml
